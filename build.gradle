plugins {
    id 'java'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.6.1'
}

// This is the single source of truth for the plugin version.
group = 'io.github.darkspirit69'
version = '1.0.0'
def pluginVersion = version.toString()
description = 'Configurable teleport requests with EssentialsX and standalone support.'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotSnapshots'
        url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
    }
}

dependencies {
    compileOnly('org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT:shaded') {
        transitive = false
    }

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

checkstyle {
    toolVersion = '10.21.2'
    configFile = file('checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Checkstyle).configureEach {
    configProperties = [
        'basedir': projectDir
    ]
}

test {
    useJUnitPlatform()
    maxHeapSize = '128m'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

// The published plugin must carry its Modrinth-check JSON parser with it.
jar {
    enabled = false
}

shadowJar {
    archiveBaseName = 'TPAUI'
    archiveClassifier = ''
    relocate 'com.google.gson', 'dev.darkspirit69.tpaui.internal.gson'
    relocate 'org.bstats', 'dev.darkspirit69.tpaui.internal.bstats'
    manifest {
        attributes(
            'Implementation-Title': 'TPAUI',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'DarkSpirit006'
        )
    }
}

tasks.build {
    dependsOn tasks.shadowJar
}

tasks.wrapper {
    gradleVersion = '9.8.0'
    distributionType = Wrapper.DistributionType.BIN
}
