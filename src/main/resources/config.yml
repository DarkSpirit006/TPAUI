settings:
  # EssentialsX mode: only /tpa with no arguments opens the menu; /tpa <player> stays EssentialsX's command.
  # Standalone mode: disabling this lets other plugins handle bare /tpa instead of opening this menu.
  intercept-bare-tpa: true
  # Check permission nodes normally. Set false to let everyone use TPAUI features.
  # EssentialsX still enforces its own commands when installed.
  check-permissions: true
  menu-permission: "tpaui.menu"
  # Bedrock players can use Geyser forms and a native switch for incoming request pop-ups.
  use-geyser-forms: true
  # Send anonymous usage metrics to bStats. Set false to disable TPAUI's metrics.
  bstats-enabled: true
  # Play request and selector sounds. Individual sounds are configured below.
  sounds-enabled: true

  # Java inventory layout. Size must be between 18 and 54 and is rounded down to a multiple of 9.
  # The bottom row is reserved for navigation; player count per page is clamped to available slots.
  inventory-title: "&8Teleport Menu"
  inventory-size: 54
  inventory-players-per-page: 45
  geyser-players-per-page: 15

  # Menu icon materials. Use Bukkit Material names; legacy material/data are used on older servers.
  player-item-material: "PLAYER_HEAD"
  player-item-data: 0
  player-item-legacy-material: "SKULL_ITEM"
  player-item-legacy-data: 3
  filler-material: "GRAY_STAINED_GLASS_PANE"
  filler-legacy-material: "STAINED_GLASS_PANE"
  filler-data: 7
  previous-item-material: "ARROW"
  previous-item-legacy-material: "ARROW"
  previous-item-data: 0
  close-item-material: "BARRIER"
  close-item-legacy-material: "REDSTONE"
  close-item-data: 0
  next-item-material: "ARROW"
  next-item-legacy-material: "ARROW"
  next-item-data: 0

  # Send the extra clickable action line after EssentialsX creates its request.
  request-button-delay-ticks: 1
  # Standalone request lifetime, cooldown and outgoing-request limit.
  fallback-request-expiration-seconds: 60
  fallback-request-cooldown-seconds: 3
  # Set to 0 for no limit.
  fallback-max-pending-outgoing: 5

permissions:
  # These nodes are consulted only when EssentialsX is installed.
  essentials:
    tpa: "essentials.tpa"
    tpahere: "essentials.tpahere"
    accept: "essentials.tpaccept"
    deny: "essentials.tpdeny"
    cancel: "essentials.tpacancel"
  # These nodes are consulted only when EssentialsX is absent.
  standalone:
    tpa: "tpaui.tpa"
    tpahere: "tpaui.tpahere"
    accept: "tpaui.accept"
    deny: "tpaui.deny"
    cancel: "tpaui.cancel"

sounds:
  # Volume is clamped to 0–1; pitch is clamped to 0.5–2.
  volume: 0.8
  pitch: 1.0
  menu-open: "BLOCK_CHEST_OPEN"
  request-sent: "UI_BUTTON_CLICK"
  request-received: "BLOCK_NOTE_BLOCK_PLING"
  request-accepted: "ENTITY_PLAYER_LEVELUP"
  request-denied: "BLOCK_NOTE_BLOCK_BASS"
  request-cancelled: "BLOCK_NOTE_BLOCK_PLING"
  request-expired: "BLOCK_NOTE_BLOCK_BASS"

