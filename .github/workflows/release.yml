name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(bash ./gradlew --no-daemon -q properties | sed -n 's/^version: //p')
          if [[ -z "$version" || "$version" == "unspecified" ]]; then
            echo "Unable to determine a release version from build.gradle."
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists. Update the version in build.gradle before running this workflow."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: bash ./gradlew --no-daemon clean build --warning-mode all

      - name: Verify release JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test -f "build/libs/TPAUI-${VERSION}.jar"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "build/libs/TPAUI-${VERSION}.jar" \
            --title "TPAUI $VERSION" \
            --generate-notes
